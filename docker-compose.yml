services:
  flowise:
    image: flowiseai/flowise:3.1.3
    container_name: flowise-engine
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - FLOWISE_PATH=/root/.flowise
      - FLOWISE_USERNAME=${FLOWISE_USERNAME}
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD}
      - EXPRESS_SESSION_SECRET=${EXPRESS_SESSION_SECRET}
      - FLOWISE_SECRETKEY_OVERWRITE=${FLOWISE_SECRETKEY_OVERWRITE}
    volumes:
      - flowise_data:/root/.flowise
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-gateway:
    build: ./auth-gateway
    container_name: flowise-auth-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - FLOWISE_TARGET_URL=http://flowise:3000
      - FLOWISE_USERNAME=${FLOWISE_USERNAME}
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD}
      - SESSION_SECRET=${EXPRESS_SESSION_SECRET}
    depends_on:
      - flowise
    volumes:
      - gateway_data:/usr/src/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  flowise_data:
  gateway_data:
